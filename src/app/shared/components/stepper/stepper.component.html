<section class="wizard">

  <!--  max-->
  <div class="hidden md:block w-full">
    <div class="flex min-h-16 items-center justify-between gap-4 rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
      <div class="flex items-center gap-3">
        @if (activeStepIdx > 0){
          <button id="previousStepButton" class="stepper-icon-button" (click)="prevStep()">
            <fa-icon [icon]="faChevronLeft" class="text-sm"></fa-icon>
          </button>
        }
        <span class="text-xl font-extrabold text-slate-950 md:text-2xl">
          {{currentStepLabel}}
        </span>
      </div>
      <div>
        @if (!isLastStep){
          <button id="nextStepButton" size="l" tuiButton
                  (click)="nextStep();"
                  [disabled]="!canNextStep"
                  type="submit"
                  class="tui-form__button">
            {{ 'stepper.next' | translate }}
          </button>
        }
      </div>
    </div>

  </div>

  <!--  minimal-->
  <div class="sticky top-0 z-10 my-0 block w-full border-b border-slate-200 bg-white/95 p-4 shadow-sm backdrop-blur md:hidden">
    <div class="flex justify-between gap-3">
      <div class="my-auto flex items-center gap-3">
        @if (activeStepIdx > 0){
          <button id="previousStepButton2" class="stepper-icon-button" (click)="prevStep()">
            <fa-icon [icon]="faChevronLeft" class="text-sm"></fa-icon>
          </button>
        }
        <span class="text-lg font-extrabold text-slate-950">
          {{currentStepLabel}}
        </span>
      </div>
      <div class="my-auto">
        @if (!isLastStep){
          <button id="nextStepButton2" size="m" tuiButton
                  (click)="nextStep()"
                  [disabled]="!canNextStep"
                  type="submit"
                  class="tui-form__button my-0 py-0">
            {{ 'stepper.next' | translate }}
          </button>
        }
      </div>
    </div>
  </div>



  <div class="mt-5">
    <ng-content></ng-content>
  </div>
</section>
