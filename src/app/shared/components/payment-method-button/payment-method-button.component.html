<div class="flex min-w-64 justify-end">
  <button type="submit"
          (click)="paymentMethod.emit(PaymentMethod.Cash)"
          class="text-gray-900 bg-gray-100 hover:bg-gray-200 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center dark:focus:ring-gray-500 mr-2 mb-2">
    <fa-icon [icon]="faMoneyBill" class="text-lg mr-5 "></fa-icon>
    Payer en cash
  </button>
  <button type="button"
          (click)="paymentMethod.emit(PaymentMethod.Stripe)"
          class="hover:text-white shadow-2xl hover:bg-[#2557D6]/90 focus:ring-4 focus:ring-[#2557D6]/50 font-medium rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center mr-2 mb-2">
    <img src="assets/images/payment-mastercard.png" class="h-3 mr-2">
    <img src="assets/images/payment-visa.png" class="h-3 mr-2">
    <img src="assets/images/payment-bancontact.png" class="h-3 mr-2">
    Payer en ligne
  </button>
</div>
