<div class="grid grid-cols-2 gap-4">

  <div>
    <tui-input [formControl]="firstNameForm">
      Prénom
      <input
        placeholder="Entrez votre prénom"
        tuiTextfield
      />
    </tui-input>
    <tui-error
      [formControl]="firstNameForm"
      [error]="[] | tuiFieldError | async"/>
  </div>

  <div>
    <tui-input [formControl]="lastNameForm">
      Nom
      <input
        placeholder="Entrez votre nom"
        tuiTextfield
      />
    </tui-input>
    <tui-error
      [formControl]="lastNameForm"
      [error]="[] | tuiFieldError | async"/>
  </div>

  <div class="col-span-2">
    <tui-input [formControl]="mailForm">
      Email
      <input
        placeholder="Entrez votre mail"
        tuiTextfield
      />
    </tui-input>
    <tui-error
      [formControl]="mailForm"
      [error]="[] | tuiFieldError | async"/>
  </div>

  <div class="col-span-2">
    <tui-input-phone-international
      [formControl]="phoneForm"
      [countries]="countries"
      [(countryIsoCode)]="countryIsoCode"
    >Votre numéro de téléphone</tui-input-phone-international>
    <tui-error
      [formControl]="phoneForm"
      [error]="[] | tuiFieldError | async"/>
  </div>


</div>
