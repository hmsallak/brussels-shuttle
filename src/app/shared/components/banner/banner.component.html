<div class="flex justify-start">
  @if (isError()){
    <fa-icon [icon]="faCircleExclamation" class="mr-2 text-red-600 text-xl" ></fa-icon>
  }
  <h2 class="text-xl font-semibold" [ngClass]="{'text-red-600' : isError()}">{{title}}</h2>
  @if (isMandatory()){
    <span class="text-xs font-thin my-auto ml-1">(obligatoire)</span>
  }
</div>
