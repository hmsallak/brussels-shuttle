<div class="mb-3 flex items-center justify-start border-b border-slate-200 pb-3">
  @if (isError()){
    <fa-icon [icon]="faCircleExclamation" class="mr-2 text-xl text-red-600" ></fa-icon>
  }
  <h2 class="text-lg font-extrabold text-slate-950" [ngClass]="{'text-red-600' : isError()}">{{title}}</h2>
  @if (isMandatory()){
    <span class="my-auto ml-2 rounded-full bg-cyan-50 px-2 py-1 text-[0.65rem] font-bold uppercase tracking-[0.12em] text-cyan-700">{{ 'steps.final-step.mandatory' | translate }}</span>
  }
</div>
