@for (vehicleModelPrice of journeyQuote().vehicleModelPrices; track vehicleModelPrice.vehicleModel.id){
  <div class="my-5">
    <app-vehicle-model-price [vehicleModelPrice]="vehicleModelPrice"
                             [vehicleModelIdForm]="vehicleModelIdForm"
                             [passengerCount]="passengerCount()"
                             (click)="selectVehicleModelEvent.emit(vehicleModelPrice.vehicleModel)"
    ></app-vehicle-model-price>
  </div>
}
