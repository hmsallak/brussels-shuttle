<article class="dest-card" routerLink="/booking/request">

  <!-- Image avec zoom au hover -->
  <div class="dest-card-img">
    <img [src]="imageUri()" [alt]="name()" loading="lazy">
  </div>

  <!-- Gradient overlay permanent -->
  <div class="dest-card-overlay"></div>

  <!-- Contenu sur l'image -->
  <div class="dest-card-body">
    <p class="dest-card-name">{{ name() }}</p>
    <h3 class="dest-card-title">{{ title() }}</h3>
    <div class="dest-card-cta">
      <span>{{ cta() }}</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
      </svg>
    </div>
  </div>

  <!-- Badge disponibilité -->
  <div class="dest-card-badge">
    <span class="dest-badge-dot"></span>
    24/7
  </div>

</article>
