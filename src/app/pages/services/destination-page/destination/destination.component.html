<div class="group w-full max-lg:max-w-xl shadow-2xl rounded-2xl mx-auto cursor-pointer transition ease-in-out hover:-translate-y-1 hover:scale-105 duration-300"
     routerLink="/booking/request">
  <div class="flex items-center">
    <img [src]="imageUri()" class="rounded-t-2xl w-full object-cover h-48">
  </div>
  <div class="p-4 lg:p-6 transition-all duration-300 rounded-b-2xl group-hover:bg-gray-50 h-[350px] flex flex-col">
    <span class="text-cyan-500 font-semibold mb-3 block">{{ name() }}</span>
    <h4 class="text-xl sm:text-lg lg:text-xl text-gray-900 font-medium leading-8 mb-5">{{ title() }}</h4>
    <p class="text-gray-500 leading-6">{{ description() }}</p>

    <!-- CTA en bas de la carte -->
    <div class="mt-auto flex flex-row items-center justify-start text-base font-semibold gap-2 text-cyan-500 lg:justify-start hover:text-cyan-700 my-5">
      <span class="truncate ...">{{cta()}}</span>
      <svg width="22px" height="22px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.00378 5.99561L15.004 11.9959L9.00024 17.9996" stroke="#1195a6" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" class="my-path"></path>
      </svg>
    </div>
  </div>

</div>
