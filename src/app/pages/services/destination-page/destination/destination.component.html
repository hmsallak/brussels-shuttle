<div class="group mx-auto h-full w-full cursor-pointer overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl"
     routerLink="/booking/request">
  <div class="relative flex h-52 items-center overflow-hidden bg-slate-100">
    <img [src]="imageUri()" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" alt="">
  </div>
  <div class="flex min-h-[330px] flex-col p-5 transition-all duration-300">
    <span class="mb-3 block text-xs font-bold uppercase tracking-[0.16em] text-cyan-700">{{ name() }}</span>
    <h4 class="mb-4 text-xl font-extrabold leading-7 text-slate-950">{{ title() }}</h4>
    <p class="line-clamp-5 leading-6 text-slate-600">{{ description() }}</p>

    <div class="mt-auto flex flex-row items-center justify-start gap-2 pt-6 text-sm font-extrabold text-cyan-700 transition group-hover:text-cyan-900">
      <span class="truncate">{{cta()}}</span>
      <span aria-hidden="true">&rarr;</span>
    </div>
  </div>
</div>
