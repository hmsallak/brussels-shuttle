@defer (when (booking$ | async) != null){

  <app-order-confirm [payment]="(payment$ | async)!" [booking]="(booking$ | async)!"></app-order-confirm>

} @loading (minimum 1.7s){
  <main class="grid h-[80vh] place-items-center px-6 py-24 sm:py-auto lg:px-8">
    <div class="h-80">
      <ng-lottie [options]="options" />
    </div>
  </main>
}

@if (notFound){
  <main class="grid min-h-full place-items-center px-6 py-24 sm:py-32 lg:px-8">
    <div class="text-center">
      <p class="text-base font-semibold text-cyan-600">Erreur</p>
      <h1 class="mt-4 text-3xl font-bold tracking-tight text-gray-900 sm:text-5xl">Réservation non trouvé</h1>
      <p class="mt-6 text-base leading-7 text-gray-600">Désolé mais nous ne parvenon pas à afficher la réservation.</p>
      <div class="mt-10 flex items-center justify-center gap-x-6">
        <a href="#" class="rounded-md bg-cyan-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Page principale</a>
        <a href="#" class="text-sm font-semibold text-gray-900">Contacter le support <span aria-hidden="true">&rarr;</span></a>
      </div>
    </div>
  </main>
}
