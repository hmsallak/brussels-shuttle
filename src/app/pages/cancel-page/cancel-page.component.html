@defer (on immediate){

  <main class="grid min-h-full place-items-center bg-white px-6 py-24 sm:py-32 lg:px-8">
    <div class="text-center">
      <p class="text-base font-semibold text-cyan-600">{{ 'cancel-page.payment-cancelled' | translate}}</p>
      <h1 class="mt-4 text-3xl font-bold tracking-tight text-gray-900 sm:text-5xl">{{ 'cancel-page.title' | translate}}</h1>
      <p class="mt-6 text-base leading-7 text-gray-600">{{ 'cancel-page.message' | translate}}</p>
      <div class="mt-10 flex items-center justify-center gap-x-6">
        <a routerLink="/booking/request" class="rounded-md bg-cyan-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
          {{ 'cancel-page.retry-booking' | translate}}
        </a>
        <a routerLink="/" class="text-sm font-semibold text-gray-900">
          {{ 'cancel-page.main-page' | translate}}
          <span aria-hidden="true">&rarr;</span>
        </a>
      </div>
    </div>
  </main>
} @loading (minimum 1s){
  <div class=" place-items-center h-80 mt-48">
    <ng-lottie [options]="options" />
  </div>
}
