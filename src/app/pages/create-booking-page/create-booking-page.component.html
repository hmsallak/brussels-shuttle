<app-layout>
  <section class="mx-0 md:mx-10 lg:mx-24 2xl:mx-44 mt-2 mb-10">
    @if (!loading()) {
      <app-create-booking [quote]="quoteParam ? exisingQuote() : undefined"
                          [vehicleModel]="vehicleModelParam ? vehicleModel : undefined">
      </app-create-booking>
    } @else {
<!--      <div class="skeleton h-[700px] w-full rounded-2xl"></div>-->
    }

  </section>
</app-layout>

<ngx-spinner [type]="'ball-clip-rotate'">
  <div class="w-96">
    <div class="flex justify-center items-center h-screen">
      <div class="relative inline-flex">
        <div class="w-8 h-8 bg-white rounded-full"></div>
        <div class="w-8 h-8 bg-white rounded-full absolute top-0 left-0 animate-ping"></div>
        <div class="w-8 h-8 bg-white rounded-full absolute top-0 left-0 animate-pulse"></div>
      </div>
      <div class="text-white text-lg mx-auto text-center" >
        En cours de réservation...
      </div>
    </div>
  </div>
</ngx-spinner>
