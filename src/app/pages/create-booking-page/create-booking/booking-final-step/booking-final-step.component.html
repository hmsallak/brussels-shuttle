<section class="grid grid-cols-4 gap-12">

  <div class="col-span-4 lg:col-span-2 order-first lg:order-last">
    <app-booking-resume [bookingResume]="currentBooking()"></app-booking-resume>
  </div>

  <div class="col-span-4 lg:col-span-2">
    <app-banner [title]="'steps.final-step.passengerTitle' | translate" [isMandatory]="true"></app-banner>
    <div class="my-5">
      <app-passenger (passengerEvent)="passenger.set($event)">
      </app-passenger>
    </div>

    <div class="collapse collapse-arrow mb-2">
      <input type="checkbox"/>
      <div class="collapse-title mx-0 px-0">
        <app-banner [title]="'steps.final-step.billingTitle' | translate" (click)="isBillingAddressVisible.set(!isBillingAddressVisible())"></app-banner>
      </div>
      <div class="collapse-content px-0">
        <app-billing-address (billingAddressEvent)="billingAddress.set($event)">
        </app-billing-address>
      </div>
    </div>

    <app-banner [title]="'steps.final-step.paymentTitle' | translate" [isMandatory]="true"></app-banner>
    <div class="my-5">
      <app-payment-method-button (paymentMethod)="paymentMethod.set($event)"></app-payment-method-button>
    </div>
    <div class="my-5">
      <!-- Total prix -->
      <div class="flex justify-between items-center py-4 border-t border-b border-gray-100 my-4">
        <h2 class="text-xl font-bold text-gray-900">
          {{ 'steps.final-step.total' | translate }}
        </h2>
        <span class="text-2xl font-bold text-cyan-600 tabular-nums">
          {{ totalPrice() ?? 0 | currency:CurrencyEnum.EUR }}
        </span>
      </div>

      <!-- Badges sécurité -->
      <div class="flex flex-wrap items-center justify-center gap-3 py-3 px-4 bg-gray-50 rounded-xl mb-4">
        <div class="flex items-center gap-1.5 text-xs text-gray-500 font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-green-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          Paiement sécurisé SSL
        </div>
        <span class="text-gray-200">|</span>
        <img src="assets/images/payment-visa.png" class="h-4" alt="Visa">
        <img src="assets/images/payment-mastercard.png" class="h-4" alt="Mastercard">
        <img src="assets/images/payment-bancontact.png" class="h-4" alt="Bancontact">
        <span class="text-gray-200">|</span>
        <div class="flex items-center gap-1 text-xs text-gray-500 font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-sky-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          Annulation gratuite 24h avant
        </div>
      </div>

      <!-- Conditions + bouton -->
      <label class="flex items-start gap-3 cursor-pointer py-2 mb-4">
        <input type="checkbox" [(ngModel)]="termsAndConditions" class="checkbox checkbox-accent mt-0.5 flex-shrink-0" />
        <div class="text-sm text-gray-600 leading-relaxed">
          <a routerLink="/term-of-use" target="_blank" class="text-sky-600 hover:underline font-medium">
            {{ 'steps.final-step.accept' | translate }}
          </a>
          <span class="text-gray-400 ml-1">({{ 'steps.final-step.mandatory' | translate }})</span>
        </div>
      </label>

      <div class="flex justify-end">
        <button
          (click)="bookEvent()"
          [disabled]="!isBookingValid()"
          size="l"
          tuiButton
          type="submit"
          class="tui-form__button transition-all duration-150"
          [class.opacity-50]="!isBookingValid()"
          [class.cursor-not-allowed]="!isBookingValid()">
          @if (paymentMethod() == PaymentMethodEnum.Cash) {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            {{ 'steps.final-step.book' | translate }}
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            {{ 'steps.final-step.bookAndPay' | translate }}
          }
        </button>
      </div>
    </div>
  </div>

</section>
